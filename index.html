<!doctype html>
<html class="landing" lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>بلاي ستور المشتل - Afterglow</title>
    <!-- احتفظنا بملف التصميم الأصلي، وأضفنا تنسيق بسيط فوقه -->
    <link rel="stylesheet" href="style.css" />
    <style>
      /* تصميم بسيط جداً يتماشى مع ألوان بلاي ستور المشتل */
      body {
        background-color: #050810;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      #brand {
        font-size: 24px;
        font-weight: 900;
        color: #ff007f;
        text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
        margin-bottom: 20px;
        text-align: center;
      }

      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 400px;
      }

      .meme {
        max-width: 100%;
        border-radius: 12px;
        margin-bottom: 20px;
        border: 1px solid #1a2a45;
      }

      .panel {
        background: #0a1120;
        border: 1px solid #1a2a45;
        border-radius: 16px;
        padding: 20px;
        width: 100%;
        box-sizing: border-box;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        text-align: center;
      }

      .lede {
        font-size: 14px;
        color: #00d4ff;
        margin-bottom: 20px;
        font-weight: bold;
      }

      .pick {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .opt {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(0, 212, 255, 0.05);
        border: 1px solid #1a2a45;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
      }

      .opt:has(input:checked) {
        border-color: #00d4ff;
        background: rgba(0, 212, 255, 0.15);
      }

      .opt input {
        accent-color: #ff007f;
        transform: scale(1.2);
      }

      .btn {
        margin-top: 10px;
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(45deg, #ffcc00, #ffdd55);
        color: #000;
        font-weight: 900;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        transition: all 0.2s ease;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .count {
        font-size: 12px;
        color: #8fa0b5;
        margin-top: 10px;
        direction: ltr; /* للحفاظ على الأرقام بالترتيب */
      }

      /* الحقوق البسيطة */
      .byline {
        margin-top: 30px;
        font-size: 13px;
        color: #8fa0b5;
        text-align: center;
        line-height: 1.6;
        direction: rtl;
      }
    </style>
  </head>
  <body>
    <!-- الشعار -->
    <div id="brand">بلاي ستور المشتل</div>

    <div class="shell">
      <!-- الصورة (احتفظنا بها كما هي) -->
      <img class="meme" src="meme.png" alt="" />

      <main class="panel">
        <p class="lede">PS4 kernel exploit &middot; firmware 13.52 and 14.00</p>

        <!-- النموذج الأساسي (لم يتم تغيير أي ID أو Value فيه) -->
        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>ps4-hen</span>
          </label>
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>autostart</span>
          </label>

          <button class="btn" type="submit">start</button>
          <p class="count" id="count"></p>
          <p class="count" id="cache" aria-live="polite"></p>
        </form>
      </main>
    </div>

    <!-- الحقوق -->
    <p class="byline">
      تصميم وتطوير : بلاي ستور المشتل<br>
      تواصل : 07749932347<br>
      موقعنا : بغداد / المشتل / شارع الكوسترات<br>
      جميع الحقوق محفوظة &copy; 2026
    </p>

    <!-- السكربت الأساسي (لم يتم المساس به) -->
    <script src="launch.js"></script>
  </body>
</html>
